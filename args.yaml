CMFC: &CMFC
  dataset_name: Cora
  device: auto
  gpu_id: 0
  n: 2
  k: 1
  seed: 1
  num_runs: 5
  margin1: 0.8
  m: 5

CMFC-Cora-classification:
  <<: *CMFC
  lr: 0.005
  epochs: 1000
  task_num: 50
  w_loss1: 5
  w_loss2: 5
  w_loss3: 1
  cfg: [512, 128]
  margin2: 0.2
  NN: 4
  weight_decay: 5e-05
  dropout: 0.3

CMFC-CiteSeer-classification:
  <<: *CMFC
  lr: 0.005
  epochs: 500
  task_num: 100
  w_loss1: 0.5
  w_loss2: 0.5
  w_loss3: 1
  cfg: [512, 128]
  margin2: 0.2
  NN: 4
  weight_decay: 0.0001
  dropout: 0.1

CMFC-CoraFull-classification:
  <<: *CMFC
  lr: 0.0025
  epochs: 2000
  task_num: 100
  w_loss1: 10
  w_loss2: 10
  w_loss3: 1
  cfg: [512, 128]
  margin2: 0.4
  NN: 4
  weight_decay: 5e-05
  dropout: 0.3

CMFC-CS-classification:
  <<: *CMFC
  lr: 0.0005
  epochs: 2000
  task_num: 100
  w_loss1: 5
  w_loss2: 5
  w_loss3: 1
  cfg: [512, 128]
  margin2: 0.4
  NN: 4
  weight_decay: 5e-05
  dropout: 0.1

CMFC-Computers-classification:
  <<: *CMFC
  margin1: 0.4
  lr: 0.01
  epochs: 2500
  w_loss1: 5
  w_loss2: 5
  w_loss3: 1
  margin2: 0.6
  cfg: [512, 128]
